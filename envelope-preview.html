<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Khayra Letter — Envelope Preview</title><style>/* Layout: one centered column. A sealed envelope gate first, then a single sheet of paper with the letter on it.
   Fonts: Fredoka (title), Nunito (letter and buttons), Caveat (signature), Lora (small labels). */
:root {
  --bg: #fff1f5;
  --bg-glow: #ffe0eb;
  --paper: #fffbfc;
  --paper-edge: #f3c8d7;
  --ink: #4b2938;
  --ink-soft: #966579;
  --accent: #d94f83;
  --accent-soft: #f8c3d7;
  --envelope: #f7c6d9;
  --envelope-flap: #f0a9c4;
  --leaf: #9cc3a6;
  --tape: rgba(246, 182, 207, 0.78);
  --tape-stripe: rgba(255, 255, 255, 0.5);
  --shadow: rgba(153, 67, 105, 0.20);
  --g1: #ffe5ee;
  --g2: #ffdce8;
  --g3: #fff0e6;
  --stripe-c: #f1a4c0;
  --font-display: "Fredoka", "Nunito", "Trebuchet MS", sans-serif;
  --font-hand: "Nunito", "Trebuchet MS", "Segoe UI", sans-serif;
  --font-sign: "Caveat", "Segoe Print", "Comic Sans MS", cursive;
  --font-label: "Lora", Georgia, "Times New Roman", serif;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #fff1f5;
    --bg-glow: #ffe0eb;
    --paper: #fffbfc;
    --paper-edge: #f3c8d7;
    --ink: #4b2938;
    --ink-soft: #966579;
    --accent: #d94f83;
    --accent-soft: #f4b6ce;
    --envelope: #f7c6d9;
    --envelope-flap: #f0a9c4;
    --leaf: #9cc3a6;
    --tape: rgba(246, 182, 207, 0.78);
    --tape-stripe: rgba(255, 255, 255, 0.5);
    --shadow: rgba(153, 67, 105, 0.20);
    --g1: #ffe5ee;
    --g2: #ffdce8;
    --g3: #fff0e6;
    --stripe-c: #f1a4c0;
    color-scheme: light;
  }
}

:root[data-theme="dark"] {
  --bg: #fff1f5;
  --bg-glow: #ffe0eb;
  --paper: #fffbfc;
  --paper-edge: #f3c8d7;
  --ink: #4b2938;
  --ink-soft: #966579;
  --accent: #d94f83;
  --accent-soft: #f4b6ce;
  --envelope: #f7c6d9;
  --envelope-flap: #f0a9c4;
  --leaf: #9cc3a6;
  --tape: rgba(246, 182, 207, 0.78);
  --tape-stripe: rgba(255, 255, 255, 0.5);
  --shadow: rgba(153, 67, 105, 0.20);
  --g1: #ffe5ee;
  --g2: #ffdce8;
  --g3: #fff0e6;
  --stripe-c: #f1a4c0;
  color-scheme: light;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background-color: var(--bg);
  color: var(--ink);
  font-family: var(--font-hand);
  min-height: 100vh;
  padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px));
  padding-block: 32px 56px;
  overflow-x: hidden;
}

/* ---------- Background ---------- */
.bg {
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background: linear-gradient(160deg, var(--g1) 0%, var(--g2) 50%, var(--g3) 100%);
}

#root {
  position: relative;
  z-index: 1;
  max-width: 640px;
  margin: 0 auto;
}

[hidden] {
  display: none !important;
}

.tag {
  font-family: var(--font-label);
  font-weight: 600;
  font-size: 0.8rem;
  letter-spacing: 0.26em;
  text-transform: uppercase;
  color: var(--ink-soft);
  text-align: center;
  margin: 0;
}

/* ---------- Envelope ---------- */
.gate {
  min-height: 78vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 36px;
}

.envelope {
  all: unset;
  cursor: pointer;
  position: relative;
  width: min(100%, 360px);
  aspect-ratio: 360 / 240;
  perspective: 1000px;
  filter: drop-shadow(0 22px 26px var(--shadow));
  transition: transform 0.25s ease;
}

.envelope:hover {
  transform: translateY(-5px) rotate(-1deg);
}

.envelope:focus-visible {
  outline: 3px solid var(--accent);
  outline-offset: 10px;
  border-radius: 8px;
}

.env-back,
.env-front,
.env-flap,
.flap-shadow,
.env-frame {
  position: absolute;
  inset: 0;
}

.env-back {
  background: var(--envelope-flap);
  border-radius: 8px;
  z-index: 0;
}

/* Letter card waiting inside the envelope. */
.env-letter {
  position: absolute;
  left: 7%;
  right: 7%;
  top: 8%;
  height: 78%;
  background: var(--paper);
  border-radius: 4px;
  z-index: 1;
  padding: 18% 12% 0;
  display: flex;
  flex-direction: column;
  gap: 10px;
  transition: transform 0.9s cubic-bezier(0.3, 0.7, 0.2, 1) 0.45s;
}

.env-letter i {
  display: block;
  height: 3px;
  border-radius: 2px;
  background: var(--accent-soft);
}

.env-letter i:nth-child(2) {
  width: 80%;
}

.env-letter i:nth-child(3) {
  width: 55%;
}

.envelope.opening .env-letter {
  transform: translateY(-42%);
}

.env-front {
  background: linear-gradient(170deg, rgba(255, 255, 255, 0.3) 0%, rgba(255, 255, 255, 0) 45%), var(--envelope);
  border-radius: 8px;
  clip-path: polygon(0 0, 50% 58%, 100% 0, 100% 100%, 0 100%);
  z-index: 2;
}

/* Soft edge under the flap so it reads as a separate layer. */
.flap-shadow {
  background: rgba(0, 0, 0, 0.16);
  clip-path: polygon(0 0, 100% 0, 50% 62%);
  transform: translateY(3px);
  filter: blur(2px);
  z-index: 2;
  transition: opacity 0.4s ease;
}

.env-flap {
  background: linear-gradient(180deg, rgba(0, 0, 0, 0.1) 0%, rgba(255, 255, 255, 0.16) 100%), var(--envelope-flap);
  clip-path: polygon(0 0, 100% 0, 50% 62%);
  transform-origin: top center;
  z-index: 3;
  transition: transform 0.85s cubic-bezier(0.6, 0.05, 0.3, 1), z-index 0s 0.4s;
}

.envelope.opening .env-flap {
  transform: rotateX(180deg);
  z-index: 0;
}

.envelope.opening .flap-shadow {
  opacity: 0;
}

/* Airmail stripes around the edge. */
.env-frame {
  border-radius: 8px;
  padding: 7px;
  background: repeating-linear-gradient(135deg, var(--accent) 0 14px, var(--paper) 14px 28px, var(--stripe-c) 28px 42px, var(--paper) 42px 56px);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
  z-index: 5;
  pointer-events: none;
}

/* Little postage stamp in the bottom right corner. */
.stamp {
  position: absolute;
  right: 8%;
  bottom: 13%;
  width: 40px;
  height: 48px;
  display: grid;
  place-items: center;
  background: var(--paper);
  color: var(--accent);
  font-size: 1.2rem;
  outline: 3px dotted var(--paper);
  outline-offset: 0;
  z-index: 4;
  transform: rotate(5deg);
}

/* Wax seal. */
.seal {
  position: absolute;
  left: 50%;
  top: 52%;
  width: 64px;
  height: 62px;
  transform: translate(-50%, -50%) rotate(-8deg);
  background: radial-gradient(circle at 35% 28%, #ff86b1 0%, #cf2c6b 45%, #8f1647 100%);
  border-radius: 52% 48% 55% 45% / 48% 55% 45% 52%;
  display: grid;
  place-items: center;
  z-index: 4;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3), inset 0 -3px 5px rgba(0, 0, 0, 0.22), inset 0 2px 3px rgba(255, 255, 255, 0.35);
  transition: opacity 0.3s ease, transform 0.4s ease;
}

.seal-mark {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  border: 2px solid rgba(255, 255, 255, 0.4);
  box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.25);
  display: grid;
  place-items: center;
  color: rgba(255, 255, 255, 0.9);
  font-family: var(--font-display);
  font-size: 1.3rem;
  line-height: 1;
}

.envelope.opening .seal {
  opacity: 0;
  transform: translate(-50%, -50%) rotate(-8deg) scale(1.6);
}

.to {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 15%;
  text-align: center;
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 1.3rem;
  letter-spacing: 0.28em;
  padding-left: 0.28em;
  color: var(--ink);
  z-index: 4;
}

.hint {
  animation: bob 2.4s ease-in-out infinite;
}

@keyframes bob {
  0%,
  100% {
    transform: translateY(0);
  }
  50% {
    transform: translateY(-4px);
  }
}

/* ---------- Letter ---------- */
.paper {
  background: var(--paper);
  border: 1px solid var(--paper-edge);
  border-radius: 6px;
  padding: clamp(30px, 7vw, 64px) clamp(24px, 6vw, 56px) clamp(28px, 6vw, 48px);
  box-shadow: 0 26px 50px -20px var(--shadow), 0 2px 0 var(--paper-edge);
  position: relative;
  outline: 1px dashed var(--accent-soft);
  outline-offset: -12px;
  animation: rise 0.9s cubic-bezier(0.2, 0.7, 0.2, 1) backwards;
}

/* Washi tape holding the letter to the page. */
.paper::after {
  content: "";
  position: absolute;
  top: -15px;
  left: 50%;
  width: 130px;
  height: 30px;
  transform: translateX(-50%) rotate(-3deg);
  background-color: var(--tape);
  background-image: repeating-linear-gradient(45deg, var(--tape-stripe) 0 7px, transparent 7px 14px);
  box-shadow: 0 2px 4px var(--shadow);
}

@keyframes rise {
  from {
    opacity: 0;
    transform: translateY(40px) rotate(0.6deg);
  }
}

.bloom {
  position: absolute;
  width: clamp(64px, 16vw, 92px);
  height: auto;
  pointer-events: none;
}

.bloom-tl {
  top: -14px;
  left: -10px;
  transform: rotate(-18deg);
}

.bloom-br {
  bottom: -16px;
  right: -10px;
  transform: rotate(150deg);
}

.bloom .petal {
  fill: var(--accent-soft);
}

.bloom .core {
  fill: var(--accent);
}

.bloom .dot {
  fill: var(--paper);
}

.bloom .leaf {
  fill: var(--leaf);
}

.title {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: clamp(1.2rem, 4.2vw, 1.6rem);
  line-height: 1.4;
  letter-spacing: 0.01em;
  color: var(--accent);
  text-align: center;
  margin: 12px 0 14px;
  text-wrap: balance;
  overflow-wrap: anywhere;
}

.flourish {
  display: block;
  width: min(260px, 70%);
  height: auto;
  margin: 0 auto 30px;
  color: var(--accent);
}

.para {
  font-size: clamp(1.05rem, 3.5vw, 1.2rem);
  line-height: 1.8;
  margin: 0 0 1.2em;
  font-weight: 500;
  overflow-wrap: anywhere;
  animation: fade 0.9s ease backwards;
}

.para.last {
  font-weight: 700;
  color: var(--accent);
  margin-bottom: 0;
}

@keyframes fade {
  from {
    opacity: 0;
    transform: translateY(12px);
  }
}

/* ---------- Signature ---------- */
.signature {
  margin-top: 28px;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  transform: rotate(-3deg);
  transform-origin: right center;
}

.sig-name {
  font-family: var(--font-sign);
  font-size: clamp(2.8rem, 11vw, 3.8rem);
  font-weight: 700;
  line-height: 1;
  padding: 0.12em 0.25em 0.05em 0.1em;
  color: var(--ink);
  animation: write 1.8s cubic-bezier(0.5, 0, 0.3, 1) 3.5s backwards;
}

@keyframes write {
  from {
    clip-path: inset(0 100% 0 0);
  }
  to {
    clip-path: inset(0 0 0 0);
  }
}

.sig-swash {
  width: clamp(140px, 42vw, 220px);
  height: auto;
  margin-top: -6px;
  margin-right: 0.3em;
  overflow: visible;
}

.sig-swash path {
  stroke: var(--accent);
  stroke-dasharray: 1;
  stroke-dashoffset: 0;
  animation: draw 1.2s ease-out 5s backwards;
}

@keyframes draw {
  from {
    stroke-dashoffset: 1;
  }
}

/* ---------- Photo surprise ---------- */
.surprise {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: center;
  gap: 16px;
  margin-top: 40px;
  animation: fade 0.9s ease 5.6s backwards;
}

.surprise-btn {
  font-family: var(--font-hand);
  font-size: 1.15rem;
  font-weight: 700;
  color: #fff;
  background: var(--accent);
  border: 0;
  border-radius: 999px;
  padding: 12px 34px;
  cursor: pointer;
  box-shadow: 0 10px 24px -8px var(--shadow);
  transition: transform 0.2s ease;
}

.surprise-btn:hover {
  transform: translateY(-3px) rotate(-1.5deg);
}

.playlist-link {
  font-family: var(--font-hand);
  font-size: 1.15rem;
  font-weight: 700;
  color: var(--accent);
  text-decoration: none;
  border: 2px solid var(--accent);
  border-radius: 999px;
  padding: 10px 30px;
  transition: transform 0.2s ease, background-color 0.2s ease;
}

.playlist-link:hover {
  transform: translateY(-3px) rotate(1.5deg);
  background: var(--accent-soft);
}

.playlist-link:focus-visible,
.surprise-btn:focus-visible,
.close:focus-visible {
  outline: 3px solid var(--ink);
  outline-offset: 4px;
}

.foot {
  margin-top: 36px;
}

.backdrop {
  position: fixed;
  inset: 0;
  z-index: 30;
  display: grid;
  place-items: center;
  padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px;
  background: rgba(30, 10, 30, 0.65);
  backdrop-filter: blur(4px);
  animation: dim 0.35s ease backwards;
}

@keyframes dim {
  from {
    opacity: 0;
  }
}

.polaroid {
  position: relative;
  margin: 0;
  width: min(100%, 420px);
  background: #fffdfb;
  color: #3a1f3a;
  padding: 14px 14px 10px;
  border-radius: 4px;
  box-shadow: 0 30px 60px -10px rgba(0, 0, 0, 0.55);
  transform: rotate(-2.5deg);
  animation: pop 0.7s cubic-bezier(0.2, 1.3, 0.4, 1) backwards;
}

@keyframes pop {
  from {
    opacity: 0;
    transform: translateY(80px) scale(0.6) rotate(8deg);
  }
}

.polaroid img {
  display: block;
  width: 100%;
  max-height: 62vh;
  object-fit: cover;
  border-radius: 2px;
  background: #f3dce6;
}

.polaroid figcaption {
  font-family: var(--font-hand);
  font-size: 1.4rem;
  font-weight: 700;
  text-align: center;
  padding-block: 8px 2px;
}

.photo-missing {
  aspect-ratio: 4 / 5;
  display: grid;
  place-items: center;
  text-align: center;
  padding: 20px;
  font-family: var(--font-label);
  font-weight: 600;
  font-size: 0.95rem;
  line-height: 1.6;
  background: #f3dce6;
  border: 2px dashed #cf2c6b;
  border-radius: 2px;
}

.close {
  position: absolute;
  top: -14px;
  right: -14px;
  width: 40px;
  height: 40px;
  border: 0;
  border-radius: 50%;
  background: #cf2c6b;
  color: #fff;
  font-size: 1.6rem;
  line-height: 1;
  cursor: pointer;
  box-shadow: 0 6px 14px rgba(0, 0, 0, 0.35);
}

/* ---------- Hearts ---------- */
.hearts {
  position: fixed;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
  z-index: 20;
}

.heart {
  position: absolute;
  bottom: -40px;
  color: var(--accent);
  animation: float linear forwards;
}

@keyframes float {
  0% {
    transform: translateY(0) translateX(0) scale(0.6);
    opacity: 0;
  }
  10% {
    opacity: 0.9;
  }
  100% {
    transform: translateY(-110vh) translateX(var(--drift)) scale(1.2);
    opacity: 0;
  }
}

@media (prefers-reduced-motion: reduce) {
  .hint,
  .heart {
    animation: none;
  }
  .heart {
    display: none;
  }
  .paper,
  .para,
  .sig-name,
  .sig-swash path,
  .surprise,
  .backdrop,
  .polaroid {
    animation: none;
  }
  .env-flap,
  .env-letter,
  .flap-shadow,
  .seal,
  .envelope,
  .surprise-btn,
  .playlist-link {
    transition: none;
  }
}

/* Envelope polish: a softer stationery scene with layered paper, subtle embossing,
   and a more tactile wax seal. */
.gate {
  min-height: min(82vh, 780px);
  gap: 27px;
  isolation: isolate;
  position: relative;
}
.gate::before {
  content: "";
  position: absolute;
  z-index: -1;
  width: min(88vw, 510px);
  aspect-ratio: 1;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255,255,255,.62), rgba(255,255,255,.18) 48%, transparent 70%);
  filter: blur(2px);
  pointer-events: none;
}
.gate > .tag:first-child {
  font-size: .72rem;
  letter-spacing: .34em;
  color: var(--accent);
}
.envelope {
  width: min(100%, 390px);
  border-radius: 12px;
  filter: drop-shadow(0 28px 24px rgba(112, 43, 78, .18)) drop-shadow(0 7px 4px rgba(112, 43, 78, .08));
  -webkit-tap-highlight-color: transparent;
}
.envelope::before {
  content: "";
  position: absolute;
  inset: 10px 12px -9px;
  border-radius: 9px;
  background: rgba(255,255,255,.28);
  transform: rotate(2deg);
  z-index: -1;
}
.env-back {
  background: linear-gradient(145deg, #f8dce7 0%, var(--envelope-flap) 100%);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.65);
}
.env-letter {
  box-shadow: 0 3px 12px rgba(103, 35, 68, .12);
  border: 1px solid rgba(207, 44, 107, .12);
  background: linear-gradient(135deg, #fff 0%, var(--paper) 70%);
  padding-top: 17%;
  gap: 9px;
}
.env-letter::before {
  content: "FOR MY FAVORITE GIRL";
  display: block;
  margin: -7px 0 5px;
  color: var(--ink-soft);
  font-family: var(--font-label);
  font-size: clamp(6px, 1.6vw, 9px);
  letter-spacing: .16em;
  text-align: center;
  white-space: nowrap;
}
.env-letter i { opacity: .7; height: 2px; }
.env-front {
  background: linear-gradient(145deg, rgba(255,255,255,.36), transparent 55%), linear-gradient(35deg, #e9a6c0, var(--envelope));
  filter: drop-shadow(inset 0 0 0 transparent);
}
.env-flap {
  background: linear-gradient(160deg, #f7cddd 0%, var(--envelope-flap) 72%, #df91b0 100%);
  backface-visibility: hidden;
}
.env-frame {
  padding: 6px;
  opacity: .85;
  background: repeating-linear-gradient(135deg, #d35c8b 0 10px, #fff7fa 10px 20px, #a99ae9 20px 30px, #fff7fa 30px 40px);
}
.stamp {
  right: 9%;
  bottom: 12%;
  width: 43px;
  height: 50px;
  color: #c23c70;
  background: linear-gradient(145deg, #fffdfd, #f7e8ee);
  outline: 2px dashed rgba(194, 60, 112, .55);
  box-shadow: 0 2px 5px rgba(90, 24, 57, .12);
}
.seal {
  width: 68px;
  height: 66px;
  background: radial-gradient(circle at 32% 25%, #ffb2ca 0%, #e44b83 34%, #b31f59 72%, #851441 100%);
  box-shadow: 0 7px 11px rgba(92, 16, 49, .24), inset 0 -4px 6px rgba(83, 8, 39, .24), inset 0 3px 4px rgba(255,255,255,.42);
}
.seal-mark {
  border-color: rgba(255,255,255,.62);
  text-shadow: 0 1px 2px rgba(100,0,35,.25);
}
.to {
  bottom: 13%;
  font-size: 1.08rem;
  letter-spacing: .36em;
  text-shadow: 0 1px rgba(255,255,255,.35);
}
.hint {
  font-size: .68rem;
  letter-spacing: .3em;
  animation-duration: 2.8s;
}
.envelope:hover .seal {
  box-shadow: 0 9px 16px rgba(92, 16, 49, .27), inset 0 -4px 6px rgba(83, 8, 39, .24), inset 0 3px 4px rgba(255,255,255,.42);
}
.envelope:active { transform: translateY(-1px) scale(.99); }
@media (max-width: 480px) {
  .gate { min-height: 76svh; gap: 25px; }
  .envelope { width: min(100%, 340px); }
  .seal { width: 58px; height: 56px; }
  .seal-mark { width: 34px; height: 34px; }
  .stamp { width: 34px; height: 41px; font-size: 1rem; }
}
@media (prefers-reduced-motion: reduce) {
  .gate > .tag:first-child { animation: none; }
}
